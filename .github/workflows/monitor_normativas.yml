name: Monitor Normativas Lima

on:
  schedule:
    - cron: '0 13 * * *'   # 8:00 AM Lima (UTC-5) = 13:00 UTC
  workflow_dispatch:         # permite correr manualmente desde GitHub

jobs:
  monitorear:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 anthropic supabase python-dateutil

      - name: Ejecutar monitor
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
        run: python .github/scripts/monitor_normativas.py

      - name: Subir log de ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log-${{ github.run_id }}
          path: monitor_log.txt
          retention-days: 30
